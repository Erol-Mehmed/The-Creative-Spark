<header class="header-container d-flex justify-content-between align-items-center border-black border-bottom">
  <h1 class="fs-4 m-0" role="button" routerLink="">The Creative Spark</h1>
  <nav class="navigation d-flex gap-2 align-items-center">
    <ng-container *ngIf="!currentUser">
      <button class="btn btn-link fw-medium text-black text-decoration-none" (click)="openModal('signIn')">Sign In</button>
      <button class="btn btn-primary fw-medium" (click)="openModal('getStarted')">Get Started</button>
    </ng-container>

    <ng-container *ngIf="currentUser">
      <button class="btn btn-link fw-medium text-black text-decoration-none" [routerLink]="'/' + currentUser.username">
        {{ currentUser.username }}
      </button>
      <button class="btn btn-link fw-medium text-black text-decoration-none" routerLink="/create">
        Write
      </button>
      <button class="btn btn-outline-dark fw-medium" (click)="logout()">Logout</button>
    </ng-container>
  </nav>
</header>
